name: Vitals

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run action tests
        run: bash test/vitals_test.sh
      - uses: ./
        with:
          repo: ${{ github.repository }}
          threshold: 6
