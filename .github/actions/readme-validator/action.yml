name: 'README Validator'
description: 'Validate README quality and generate a health score badge'
inputs:
  repo:
    description: 'Repository to validate (format: owner/repo)'
    required: false
    default: ''
  threshold:
    description: 'Minimum score to pass (0-7)'
    required: false
    default: '6'
outputs:
  score:
    description: 'Numerical score (0-7)'
    value: ${{ steps.validator.outputs.score }}
  badge_svg:
    description: 'Markdown-ready badge SVG code'
    value: ${{ steps.validator.outputs.badge_svg }}
runs:
  using: 'composite'
  steps:
    - id: validator
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
      run: bash "${{ github.action_path }}/entrypoint.sh"